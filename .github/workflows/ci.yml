# ================================================================== #
# NeuroSQL — CI Pipeline
#
# Runs on every push to main and every pull request.
# Builds the backend Docker image and runs all unit tests.
# ================================================================== #

name: NeuroSQL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ------------------------------------------------------------------ #
  # Backend tests
  # ------------------------------------------------------------------ #
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      # PostgreSQL for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neurosql_test
          POSTGRES_USER: neurosql
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for Celery tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          APP_NAME=NeuroSQL
          APP_ENV=development
          APP_DEBUG=true
          SECRET_KEY=test-secret-key-for-ci-only-not-production-64chars-padding
          API_V1_PREFIX=/api/v1
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
          JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
          DATABASE_URL=postgresql+asyncpg://neurosql:test_password@localhost:5432/neurosql_test
          POSTGRES_DB=neurosql_test
          POSTGRES_USER=neurosql
          POSTGRES_PASSWORD=test_password
          REDIS_URL=redis://localhost:6379/0
          CELERY_BROKER_URL=redis://localhost:6379/1
          CELERY_RESULT_BACKEND=redis://localhost:6379/2
          OPENAI_API_KEY=sk-test-key-not-real
          OPENAI_MODEL=gpt-4o
          OPENAI_EMBEDDING_MODEL=text-embedding-3-small
          PINECONE_API_KEY=test-pinecone-key-not-real
          PINECONE_INDEX_NAME=neurosql-test
          PINECONE_ENVIRONMENT=us-east-1
          PINECONE_USE_HOSTED_EMBEDDING=true
          CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DEFAULT_ORG_NAME=Test Organization
          SUPER_ADMIN_EMAIL=admin@test.com
          SUPER_ADMIN_PASSWORD=TestPassword123
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          CELERY_WORKER_CONCURRENCY=2
          GROQ_API_KEY=test-groq-key-not-real
          GROQ_MODEL=llama-3.3-70b-versatile
          EOF

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/unit/ -v --tb=short --no-header \
            -p no:cacheprovider \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ------------------------------------------------------------------ #
  # Frontend build check
  # ------------------------------------------------------------------ #
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_APP_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # Docker build check
  # ------------------------------------------------------------------ #
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          target: runtime
          push: false
          tags: neurosql-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          target: builder
          push: false
          tags: neurosql-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max