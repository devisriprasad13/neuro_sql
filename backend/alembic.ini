# ================================================================== #
# Alembic configuration file
#
# This file is read by Alembic when running migration commands.
# Run from inside the backend/ directory:
#
#   alembic upgrade head        → apply all pending migrations
#   alembic downgrade -1        → revert last migration
#   alembic revision --autogenerate -m "description"  → create new migration
#   alembic history             → show migration history
#   alembic current             → show current database version
# ================================================================== #

[alembic]
# Path to migration scripts directory
# Relative to the location of this alembic.ini file
script_location = alembic

# Template for migration file names
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d - human-readable timestamp
# %(rev)s - short revision ID
# %(slug)s - slugified message from --message flag
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
timezone = UTC

# Maximum length of the slug (message) in filename
truncate_slug_length = 40

# sys.path entries to prepend before importing
# '.' means the backend/ directory is on the path
# This allows Alembic to import 'app.config', 'app.models', etc.
prepend_sys_path = .

# Version table name in the database
# Alembic creates this table to track which migrations have been applied
version_table = alembic_version

# ------------------------------------------------------------------ #
# Database URL
#
# We intentionally leave this blank here.
# The actual URL is injected in alembic/env.py from app.config
# so credentials never appear in this committed file.
# ------------------------------------------------------------------ #
sqlalchemy.url =

# ------------------------------------------------------------------ #
# Logging configuration
# Controls what Alembic prints to the terminal during migrations
# ------------------------------------------------------------------ #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S