<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta tags -->
    <title>NeuroSQL — AI Database Platform</title>
    <meta
      name="description"
      content="Query any database in plain English. AI-powered natural language to SQL engine."
    />

    <!-- Prevent search engines from indexing in development -->
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <!--
      React mounts the entire application here.
      This div is empty on page load — React fills it in main.tsx.
    -->
    <div id="root"></div>

    <!--
      Vite entry point.
      This script tag loads main.tsx which bootstraps React.
      type="module" enables ES module imports in the browser.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
